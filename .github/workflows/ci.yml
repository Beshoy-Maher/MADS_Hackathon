# Runs on every push and pull request: the smoke tests, the submission self-check and the one-command setup.
# No model and no network are needed for the tests; the model is never downloaded here.
name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Smoke tests (no model, no network)
        run: pytest -q
        env:
          LLM_PROVIDER: none
          RESEARCH_ONLINE: "false"
      - name: Submission self-check
        if: github.ref == 'refs/heads/main'
        run: python scripts/check_submission.py
        env:
          LLM_PROVIDER: none
          RESEARCH_ONLINE: "false"

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker-compose.yml is valid
        run: docker compose config --quiet
      - name: The app image builds
        run: docker compose build app
