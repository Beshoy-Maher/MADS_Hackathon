# One command: docker compose up
# Starts a local Ollama server, downloads one small open-weight model (qwen3:4b, ~2.5 GB) once,
# and serves the founder dashboard at http://localhost:8000.
# The dashboard works immediately: until the model is ready, agents use labelled TEMPLATE text.
services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama:/root/.ollama

  model-pull:
    image: ollama/ollama:latest
    depends_on:
      - ollama
    environment:
      - OLLAMA_HOST=ollama:11434
    entrypoint: ["/bin/sh", "-c", "until ollama list >/dev/null 2>&1; do sleep 2; done; ollama pull ${LLM_MODEL:-qwen3:4b}"]
    restart: "no"

  app:
    build: .
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      - ollama
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama}
      - LLM_BASE_URL=http://ollama:11434
      - LLM_MODEL=${LLM_MODEL:-qwen3:4b}
      - LLM_COST_PER_MTOK=0
      - RESEARCH_ONLINE=${RESEARCH_ONLINE:-true}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - FOUNDER_TOKEN=${FOUNDER_TOKEN:-}
      - PAYMENT_MODE=mock
    volumes:
      - appdata:/app/data

volumes:
  ollama:
  appdata:
