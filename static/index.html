<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Venture Gates</title>
<style>
  :root { --bg:#f7f7f5; --card:#fff; --ink:#1d1d1b; --muted:#6b6b66; --line:#e3e3de;
          --go:#1f7a4d; --repeat:#a86b00; --pivot:#3b5bb5; --stop:#b3261e; }
  * { box-sizing:border-box }
  body { margin:0; font:15px/1.5 system-ui, sans-serif; background:var(--bg); color:var(--ink) }
  header { padding:14px 20px; border-bottom:1px solid var(--line); background:var(--card); display:flex; gap:12px; align-items:center; flex-wrap:wrap }
  header h1 { font-size:18px; margin:0 }
  .tag { font-size:12px; padding:2px 8px; border-radius:99px; border:1px solid var(--line); color:var(--muted) }
  .tag.warn { border-color:var(--repeat); color:var(--repeat) }
  main { display:grid; grid-template-columns:300px 1fr; gap:16px; padding:16px; max-width:1200px; margin:auto }
  @media (max-width:800px) { main { grid-template-columns:1fr } }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; margin-bottom:14px }
  h2 { font-size:15px; margin:0 0 10px }
  select, textarea, input, button { font:inherit }
  textarea { width:100%; height:180px; font:12px monospace; border:1px solid var(--line); border-radius:6px; padding:6px }
  input[type=text] { width:100%; padding:6px; border:1px solid var(--line); border-radius:6px }
  button { padding:6px 12px; border-radius:6px; border:1px solid var(--line); background:#fff; cursor:pointer }
  button.primary { background:var(--ink); color:#fff; border-color:var(--ink) }
  .runs div { padding:6px; border-radius:6px; cursor:pointer } .runs div:hover { background:var(--bg) }
  .phases { display:flex; gap:4px; flex-wrap:wrap; margin-bottom:12px }
  .phases span { flex:1; min-width:90px; text-align:center; font-size:12px; padding:6px 4px; border-radius:6px; background:var(--bg); color:var(--muted) }
  .phases span.done { background:#e4f1ea; color:var(--go) } .phases span.now { background:var(--ink); color:#fff }
  .rec { font-size:22px; font-weight:700 } .go{color:var(--go)} .repeat{color:var(--repeat)} .pivot{color:var(--pivot)} .stop{color:var(--stop)}
  table { border-collapse:collapse; width:100%; font-size:13px } td, th { border-bottom:1px solid var(--line); padding:4px 6px; text-align:left }
  .pass { color:var(--go); font-weight:600 } .fail { color:var(--stop); font-weight:600 }
  .btns { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px }
  pre { white-space:pre-wrap; font-size:12px; background:var(--bg); padding:10px; border-radius:6px; max-height:420px; overflow:auto }
  iframe { width:100%; height:420px; border:1px solid var(--line); border-radius:6px; background:#fff }
  .files a { display:inline-block; margin:2px 6px 2px 0; font-size:13px; cursor:pointer; color:var(--pivot) }
  .err { color:var(--stop) } .muted { color:var(--muted); font-size:13px }
</style>
</head>
<body>
<header>
  <h1>Venture Gates</h1>
  <span class="tag" id="model">model: checking</span>
  <span class="tag warn">Payments: MOCKED</span>
  <span class="tag warn">Publishing and sending: STUBBED (outbox only)</span>
</header>
<main>
  <section>
    <div class="card">
      <h2>New idea</h2>
      <select id="sample"></select>
      <textarea id="brief"></textarea>
      <div class="btns"><button class="primary" onclick="startRun()">Run Phase 1</button></div>
      <p class="muted">The brief is screened first. Excluded products (finance, crypto, health or legal advice, physical goods) and deceptive requests are refused.</p>
      <div id="startErr" class="err"></div>
    </div>
    <div class="card"><h2>Runs</h2><div class="runs" id="runs"></div></div>
  </section>
  <section id="view"><div class="card muted">Start a run or pick one from the list.</div></section>
</main>
<script>
const PH = ["Discover","Validate","Build","Commercial","Sell & get paid","Operate & learn"];
let current = null;
const token = () => localStorage.getItem("founderToken") || "";
async function api(path, body) {
  const opt = body ? {method:"POST", headers:{"Content-Type":"application/json","X-Founder-Token":token()}, body:JSON.stringify(body)} : {};
  const r = await fetch(path, opt); const j = await r.json(); if (!r.ok) throw new Error(j.error || r.status); return j;
}
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
async function init() {
  const s = await api("/api/status");
  document.getElementById("model").textContent = s.model_available ? `model: ${s.model} (local)` : `model: ${s.model} not reachable, TEMPLATE text`;
  if (s.token_required && !token()) localStorage.setItem("founderToken", prompt("Founder token") || "");
  const sel = document.getElementById("sample");
  sel.innerHTML = s.briefs.map(b => `<option>${b}</option>`).join("");
  sel.onchange = loadBrief; loadBrief(); listRuns();
}
async function loadBrief() { document.getElementById("brief").value = JSON.stringify(await api("/api/briefs/" + document.getElementById("sample").value), null, 1); }
async function listRuns() {
  const runs = await api("/api/runs");
  document.getElementById("runs").innerHTML = runs.map(r => `<div onclick="show('${r.id}')"><b>${esc(r.brief_name)}</b><br><span class="muted">${r.status}, phase ${r.phase}, ${r.recommendation || ""}</span></div>`).join("") || '<span class="muted">none yet</span>';
}
async function startRun() {
  const e = document.getElementById("startErr"); e.textContent = "Running Phase 1 (searching public sources)...";
  try { const r = await api("/api/runs", {brief: JSON.parse(document.getElementById("brief").value)}); e.textContent = ""; render(r); listRuns(); }
  catch (x) { e.textContent = x.message; }
}
async function show(id) { render(await api("/api/runs/" + id)); }
async function decide(d) {
  try { render(await api(`/api/runs/${current.id}/decide`, {decision:d, reason:document.getElementById("reason").value})); listRuns(); }
  catch (x) { document.getElementById("decErr").textContent = x.message; }
}
async function outbound(item, ok) {
  if (!confirm((ok ? "Approve" : "Reject") + " this item?")) return;
  render(await api(`/api/runs/${current.id}/outbound/${item}`, {approve: ok})); listRuns();
}
async function openFile(name) {
  const t = await (await fetch(`/api/runs/${current.id}/file/${name}`)).text();
  document.getElementById("file").innerHTML = name.endsWith(".html") ? `<iframe sandbox srcdoc="${esc(t)}"></iframe>` : `<pre>${esc(t)}</pre>`;
}
function render(r) {
  current = r; const g = r.gate || {checks:[], reasons:[]};
  const phases = PH.map((p,i) => `<span class="${i+1 < r.phase || r.status==='done' ? 'done' : (i+1===r.phase ? 'now' : '')}">${i+1}. ${p}</span>`).join("");
  const checks = g.checks.map(c => `<tr><td>${esc(c.name)}</td><td>${esc(c.value)}</td><td>${esc(c.threshold)}</td><td class="${c.passed?'pass':'fail'}">${c.passed?'PASS':'FAIL'}</td></tr>`).join("");
  const waiting = r.status === "awaiting_founder";
  const out = (r.outbound||[]).map(i => `<tr><td>${esc(i.kind)}</td><td>${esc(i.title)}</td><td>${i.status}</td><td>${i.status==='pending' ? `<button onclick="outbound('${i.id}',true)">Approve</button> <button onclick="outbound('${i.id}',false)">Reject</button>` : ''}</td></tr>`).join("");
  document.getElementById("view").innerHTML = `
  <div class="card"><div class="phases">${phases}</div>
    <div class="muted">Run ${r.id}, status <b>${r.status}</b></div>
    <h2 style="margin-top:10px">Gate: ${esc(g.gate)}</h2>
    <div class="rec ${g.outcome}">Recommends ${String(g.outcome).toUpperCase()}</div>
    <ul>${g.reasons.map(x => `<li>${esc(x)}</li>`).join("")}</ul>
    <table><tr><th>Check</th><th>Value</th><th>Threshold</th><th></th></tr>${checks}</table>
    ${waiting ? `<p class="muted">Your call. Choosing something other than ${String(g.outcome).toUpperCase()} needs a reason, which is logged.</p>
      <input type="text" id="reason" placeholder="Reason (required to override)">
      <div class="btns">${["go","repeat","pivot","stop"].map(d => `<button class="${d===g.outcome?'primary':''}" onclick="decide('${d}')">${d.toUpperCase()}</button>`).join("")}</div>
      <div id="decErr" class="err"></div>` : ""}
  </div>
  <div class="card"><h2>Approval queue (nothing leaves without your click)</h2>
    ${out ? `<table><tr><th>Kind</th><th>Item</th><th>Status</th><th></th></tr>${out}</table>` : '<span class="muted">empty</span>'}</div>
  <div class="card"><h2>Outputs</h2><div class="files">${(r.outputs||[]).map(f => `<a onclick="openFile('${f}')">${f}</a>`).join("")}</div><div id="file"></div></div>`;
}
init();
</script>
</body>
</html>
